[project]
name = "feishu-mail-advisor"
version = "0.1.0"
description = "Feishu and mail personal digital advisor built on FastAPI, PostgreSQL, Redis, Celery, Qdrant, MinIO, and OpenAI."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "celery[redis]==5.6.3",
  "email-validator==2.3.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "lark-oapi==1.6.8",
  "minio==7.2.20",
  "openai==2.41.0",
  "Pillow==12.0.0",
  "psycopg[binary]==3.3.4",
  "PyMuPDF==1.26.7",
  "pypdf==6.13.2",
  "pytesseract==0.3.13",
  "pydantic-settings==2.14.1",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "SQLAlchemy==2.0.50",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
