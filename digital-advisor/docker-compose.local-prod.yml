services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advisor}
      POSTGRES_USER: ${POSTGRES_USER:-advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-advisor}\" -d \"$${POSTGRES_DB:-advisor}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  api:
    image: digital-advisor-api:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-advisor}:${POSTGRES_PASSWORD:-advisor}@postgres:5432/${POSTGRES_DB:-advisor}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}:/root/.lark-cli:ro
      - ${LARK_CLI_DATA_HOME:-${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}/share}:/root/.local/share/lark-cli:ro
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "0.0.0.0:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    image: digital-advisor-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-advisor}:${POSTGRES_PASSWORD:-advisor}@postgres:5432/${POSTGRES_DB:-advisor}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}:/root/.lark-cli:ro
      - ${LARK_CLI_DATA_HOME:-${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}/share}:/root/.local/share/lark-cli:ro
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app worker --loglevel=info

  beat:
    image: digital-advisor-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-advisor}:${POSTGRES_PASSWORD:-advisor}@postgres:5432/${POSTGRES_DB:-advisor}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}:/root/.lark-cli:ro
      - ${LARK_CLI_DATA_HOME:-${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}/share}:/root/.local/share/lark-cli:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app beat --loglevel=info

  feishu-ws:
    network_mode: host
    image: digital-advisor-api:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./app:/app/app
      - ${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}:/root/.lark-cli
      - ${LARK_CLI_DATA_HOME:-${LARK_CLI_HOME:-${PWD}/.local/lark-cli-v5}/share}:/root/.local/share/lark-cli
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.workers.feishu_ws

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
