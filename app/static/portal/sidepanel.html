<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>结果明细</title>
  <link rel="stylesheet" href="/portal/assets/styles.css" />
</head>
<body class="sidepanel-mode">
  <main class="portal sidepanel">
    <header class="hero">
      <div>
        <p class="eyebrow">数字参谋</p>
        <h1>结果明细</h1>
        <p>查看当前会话关联明细。</p>
      </div>
      <button id="refreshBtn">刷新</button>
    </header>

    <section class="setup">
      <label>
        App Config ID
        <input id="appConfigId" placeholder="飞书应用配置 ID" />
      </label>
      <label>
        Open ID
        <input id="openId" placeholder="当前用户 open_id" />
      </label>
      <label>
        Admin Token
        <input id="adminToken" placeholder="可留空" />
      </label>
    </section>

    <section id="status" class="status">正在识别当前会话。</section>

    <section class="workspace">
      <aside class="list">
        <div class="section-title">结果列表</div>
        <div id="approvalList" class="approval-list"></div>
      </aside>
      <section class="detail">
        <div class="section-title">详情</div>
        <div id="approvalDetail" class="empty">正在加载结果明细。</div>
      </section>
    </section>
  </main>
  <section id="confirmSheet" class="confirm-sheet hidden">
    <div class="confirm-card">
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmSummary"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="secondary">取消</button>
        <button id="confirmSubmit">确认提交</button>
      </div>
    </div>
  </section>
  <script src="/portal/assets/app.js"></script>
</body>
</html>
